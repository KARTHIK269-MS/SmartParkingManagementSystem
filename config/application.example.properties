# ==============================================================================
# Smart Parking Management System — Database Configuration Template
# ==============================================================================
# Instructions:
# 1. Copy this template to create your local active configuration file:
#      cp config/application.example.properties config/application.properties
#    (or cp config/application.example.properties db.properties)
#
# 2. Update the credentials below with your local MySQL 8 database settings.
#    NEVER commit your active configuration file containing real passwords to Git!
#
# 3. Alternatively, you can configure these via environment variables:
#      DB_URL, DB_USER, DB_PASSWORD
#    Or via JVM system properties:
#      -Ddb.url=... -Ddb.user=... -Ddb.password=...
# ==============================================================================

# JDBC Connection URL (Target: parking_system on MySQL 8.x)
db.url=jdbc:mysql://localhost:3306/parking_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

# MySQL Database Username
db.user=root

# MySQL Database Password (Replace with your actual local database password)
db.password=your_database_password_here
