name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Verify Project Build with Maven
      run: mvn -B compile package -DskipTests --file pom.xml

    - name: Verify Web Application Archive (WAR)
      run: |
        ls -la target/
        test -f target/smart-parking-system.war
